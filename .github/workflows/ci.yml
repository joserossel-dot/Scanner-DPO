name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Install PostgreSQL test runtime
        run: sudo apt-get update && sudo apt-get install -y postgresql
      - name: Verify tenant migrations and RLS
        run: bash scripts/test-tenant-migration.sh
      - run: npm audit --omit=dev --audit-level=high
